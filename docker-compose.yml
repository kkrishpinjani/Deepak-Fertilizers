services:
  neo4j:
    image: neo4j:5-community
    container_name: sap-anaplan-neo4j
    restart: unless-stopped
    ports:
      - "7475:7474" # browser UI: http://localhost:7475 (7474 taken by another project's neo4j)
      - "7688:7687" # bolt (app connection; 7687 taken by another project's neo4j)
    environment:
      NEO4J_AUTH: neo4j/SapAnaplan2026
      NEO4J_PLUGINS: '["apoc"]'
    volumes:
      - sap-anaplan-neo4j-data:/data

volumes:
  sap-anaplan-neo4j-data:
